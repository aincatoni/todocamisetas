# docker-compose.yml
services:
  app:
    build:
      context: ./docker/php
    container_name: todocamisetas_app
    volumes:
      - ./backend:/var/www/html
    networks:
      - todocamisetas_net
    depends_on:
      - db
  webserver:
    image: nginx:stable-alpine
    container_name: todocamisetas_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - todocamisetas_net
    depends_on:
      - app
  db:
    image: mysql:8.0
    container_name: todocamisetas_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todocamisetas
      MYSQL_USER: todocamisetas_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - todocamisetas_net
networks:
  todocamisetas_net:
    driver: bridge
volumes:
  db_data:
